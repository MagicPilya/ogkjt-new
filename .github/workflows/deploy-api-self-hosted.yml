name: Deploy API to cPanel (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force API deploy even when no API-related changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]

jobs:
  deploy-api:
    # Runner must be inside FortiClient VPN and allowed by hoster.by ACL.
    runs-on: [self-hosted, windows]
    timeout-minutes: 35
    concurrency:
      group: deploy-api-main
      cancel-in-progress: true

    steps:
      - name: Validate required secrets (fail-fast)
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_HOST)) { throw "Missing secret: CPANEL_HOST" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_USER)) { throw "Missing secret: CPANEL_USER" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY) -and [string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY_B64)) {
            throw "Missing secret: set CPANEL_SSH_KEY or CPANEL_SSH_KEY_B64"
          }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { echo "CPANEL_PORT is empty, defaulting to 22" }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect API-related changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'backend/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy-api-self-hosted.yml'

      - name: Skip API deploy (no relevant changes)
        if: steps.changes.outputs.api != 'true' && github.event.inputs.force_deploy != 'true'
        shell: powershell
        run: |
          Write-Host "No API-related changes detected. Skipping API build/deploy."

      - name: Setup Node.js
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies (required by shared PostCSS config)
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: npm ci

      - name: Install backend dependencies
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: npm --prefix backend ci

      - name: Build Strapi admin
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: npm --prefix backend run build

      - name: Pack API release
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: |
          $adminBuildPath = $null
          if (Test-Path .\backend\build) {
            $adminBuildPath = ".\backend\build"
          } elseif (Test-Path .\backend\dist\build) {
            $adminBuildPath = ".\backend\dist\build"
          } else {
            throw "Strapi admin build is missing: neither backend/build nor backend/dist/build exists"
          }
          Remove-Item -Recurse -Force .\api-deploy -ErrorAction SilentlyContinue
          New-Item -ItemType Directory .\api-deploy\backend -Force | Out-Null
          Copy-Item $adminBuildPath .\api-deploy\backend\build -Recurse -Force
          Copy-Item .\backend\config .\api-deploy\backend\ -Recurse -Force
          Copy-Item .\backend\database .\api-deploy\backend\ -Recurse -Force
          Copy-Item .\backend\dist .\api-deploy\backend\ -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item .\backend\public .\api-deploy\backend\ -Recurse -Force
          Copy-Item .\backend\src .\api-deploy\backend\ -Recurse -Force
          Copy-Item .\backend\package.json .\api-deploy\backend\package.json -Force
          Copy-Item .\backend\package-lock.json .\api-deploy\backend\package-lock.json -Force
          Copy-Item .\backend\strapi-start.js .\api-deploy\backend\strapi-start.js -Force
          if (Test-Path .\api-release.tar.gz) { Remove-Item .\api-release.tar.gz -Force }
          tar -czf .\api-release.tar.gz -C .\api-deploy backend

      - name: Upload and deploy API via SSH
        if: steps.changes.outputs.api == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_NODE_MAJOR: ${{ secrets.CPANEL_NODE_MAJOR }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          $hostName = $env:CPANEL_HOST
          $userName = $env:CPANEL_USER
          $port = if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { "22" } else { $env:CPANEL_PORT }
          $nodeMajor = if ([string]::IsNullOrWhiteSpace($env:CPANEL_NODE_MAJOR)) { "20" } else { $env:CPANEL_NODE_MAJOR }

          $remoteArchive = "/home/$userName/tmp/api-release.tar.gz"
          $remoteScript = "/home/$userName/tmp/deploy-api.sh"

          $localScriptPath = Join-Path $env:RUNNER_TEMP "deploy-api.sh"
          $template = Get-Content -Raw ".\scripts\ci\deploy-api.sh.tpl"
          $lfScript = $template.Replace("__REMOTE_ARCHIVE__", $remoteArchive).Replace("__USER__", $userName).Replace("__NODE_MAJOR__", $nodeMajor)
          $lfScript = $lfScript -replace "`r`n", "`n"
          $lfScript = $lfScript -replace "`r", "`n"
          if (-not $lfScript.EndsWith("`n")) { $lfScript += "`n" }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($localScriptPath, $lfScript, $utf8NoBom)

          .\scripts\ci\invoke-cpanel-deploy.ps1 `
            -HostName $hostName `
            -UserName $userName `
            -Port $port `
            -SshKey $env:CPANEL_SSH_KEY `
            -SshKeyB64 $env:CPANEL_SSH_KEY_B64 `
            -LocalArchivePath ".\api-release.tar.gz" `
            -RemoteArchivePath $remoteArchive `
            -LocalScriptPath $localScriptPath `
            -RemoteScriptPath $remoteScript `
            -PrecheckCommand "mkdir -p /home/$userName/tmp /home/$userName/apps/ogkjt-api/tmp"
