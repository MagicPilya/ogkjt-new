name: Deploy Web to cPanel (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy-web:
    # Runner must be inside FortiClient VPN and allowed by hoster.by ACL.
    runs-on: [self-hosted, windows]

    steps:
      - name: Validate required secrets (fail-fast)
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_HOST)) { throw "Missing secret: CPANEL_HOST" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_USER)) { throw "Missing secret: CPANEL_USER" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY) -and [string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY_B64)) {
            throw "Missing secret: set CPANEL_SSH_KEY or CPANEL_SSH_KEY_B64"
          }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { echo "CPANEL_PORT is empty, defaulting to 22" }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Build Next.js (webpack)
        shell: powershell
        run: npm run build -- --webpack

      - name: Prepare lightweight deploy package
        shell: powershell
        run: |
          Remove-Item -Recurse -Force .\deploy -ErrorAction SilentlyContinue
          New-Item -ItemType Directory .\deploy\.next -Force | Out-Null
          New-Item -ItemType Directory .\deploy\tmp -Force | Out-Null
          # CloudLinux Node.js Selector expects node_modules as a symlink in app root.
          # Exclude standalone/node_modules from deploy artifact.
          if (Test-Path .\deploy\node_modules) { Remove-Item -Recurse -Force .\deploy\node_modules }
          robocopy .\.next\standalone .\deploy /E /XD node_modules | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          Copy-Item .\.next\static .\deploy\.next\ -Recurse -Force
          Copy-Item .\public .\deploy\ -Recurse -Force
          Copy-Item .\package-lock.json .\deploy\package-lock.json -Force
          Get-Date -Format "yyyy-MM-ddTHH:mm:ssK" | Set-Content .\deploy\tmp\restart.txt
          if (Test-Path .\web-release.tar.gz) { Remove-Item .\web-release.tar.gz -Force }
          tar -czf .\web-release.tar.gz -C .\deploy .

      - name: Upload and deploy via SSH
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_NODE_MAJOR: ${{ secrets.CPANEL_NODE_MAJOR }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          $hostName = $env:CPANEL_HOST
          $userName = $env:CPANEL_USER
          $port = if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { "22" } else { $env:CPANEL_PORT }
          $nodeMajor = if ([string]::IsNullOrWhiteSpace($env:CPANEL_NODE_MAJOR)) { "20" } else { $env:CPANEL_NODE_MAJOR }

          $keyPath = Join-Path $env:RUNNER_TEMP "cpanel_deploy_key"
          if (-not [string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY_B64)) {
            [System.IO.File]::WriteAllBytes($keyPath, [System.Convert]::FromBase64String($env:CPANEL_SSH_KEY_B64))
          } else {
            $keyBody = $env:CPANEL_SSH_KEY.Trim()
            # Support secrets pasted as one line with escaped newlines.
            $keyBody = $keyBody -replace "\\n", "`n"
            $keyBody = $keyBody -replace "`r", ""
            if (($keyBody -notmatch "-----BEGIN OPENSSH PRIVATE KEY-----") -and ($keyBody -notmatch "-----BEGIN RSA PRIVATE KEY-----")) {
              throw "CPANEL_SSH_KEY must be an OpenSSH/RSA private key (not .ppk/public key)."
            }
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($keyPath, $keyBody, $utf8NoBom)
          }
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$env:USERNAME`:R" | Out-Null

          $remoteArchive = "/home/$userName/tmp/web-release.tar.gz"
          $remoteAppDir = "/home/$userName/apps/ogkjt-web"
          $remoteScript = "/home/$userName/tmp/deploy-web.sh"

          $sshExe = (Get-Command ssh -ErrorAction SilentlyContinue).Source
          $scpExe = (Get-Command scp -ErrorAction SilentlyContinue).Source
          if (-not $sshExe) {
            $gitSsh = Join-Path ${env:ProgramFiles} "Git\usr\bin\ssh.exe"
            if (Test-Path $gitSsh) { $sshExe = $gitSsh }
          }
          if (-not $scpExe) {
            $gitScp = Join-Path ${env:ProgramFiles} "Git\usr\bin\scp.exe"
            if (Test-Path $gitScp) { $scpExe = $gitScp }
          }
          if (-not $sshExe -or -not $scpExe) {
            throw "ssh/scp not found. Install OpenSSH Client or Git for Windows on the runner."
          }

          & $sshExe -i $keyPath -p $port -o StrictHostKeyChecking=accept-new "$userName@$hostName" "mkdir -p /home/$userName/tmp $remoteAppDir $remoteAppDir/tmp"
          if ($LASTEXITCODE -ne 0) { throw "SSH pre-check failed" }

          & $scpExe -i $keyPath -P $port -o StrictHostKeyChecking=accept-new .\web-release.tar.gz "$userName@$hostName`:$remoteArchive"
          if ($LASTEXITCODE -ne 0) { throw "SCP upload failed" }

          $localScriptPath = Join-Path $env:RUNNER_TEMP "deploy-web.sh"
          $scriptLines = @(
            "#!/usr/bin/env bash",
            "set -e",
            "APP_DIR='$remoteAppDir'",
            "ARCHIVE='$remoteArchive'",
            "cd `"$remoteAppDir`"",
            "rel=_incoming_`$(date +%s)",
            "mkdir -p `"`$rel`"",
            "tar -xzf `"$remoteArchive`" -C `"`$rel`"",
            "if [ -d .next ]; then mv .next .next_old_`$(date +%s) || true; fi",
            "if [ -d public ]; then mv public public_old_`$(date +%s) || true; fi",
            "if [ -d `"`$rel/.next`" ]; then mv `"`$rel/.next`" .next; fi",
            "if [ -d `"`$rel/public`" ]; then mv `"`$rel/public`" public; fi",
            "cp -f `"`$rel/server.js`" ./server.js 2>/dev/null || true",
            "cp -f `"`$rel/package.json`" ./package.json 2>/dev/null || true",
            "cp -f `"`$rel/package-lock.json`" ./package-lock.json",
            "# CloudLinux nodeenv may not have bin/activate; set PATH to selected Node bin",
            "export PATH=/home/$userName/nodevenv/apps/ogkjt-web/$nodeMajor/bin:`$PATH",
            "LOCK_HASH_FILE=/home/$userName/apps/ogkjt-web/.last-lock-hash",
            "NEW_HASH=`$(sha256sum package-lock.json | awk '{print `$1}')",
            "OLD_HASH=`$(cat `"$LOCK_HASH_FILE`" 2>/dev/null || true)",
            "if [ `"$NEW_HASH`" != `"$OLD_HASH`" ]; then npm ci --omit=dev --no-audit --no-fund && echo `"$NEW_HASH`" > `"$LOCK_HASH_FILE`"; else echo `"Dependencies unchanged, skip npm ci`"; fi",
            "mkdir -p tmp",
            "touch tmp/restart.txt",
            "rm -f `"$remoteArchive`"",
            "rm -rf `"`$rel`""
          )
          $lfScript = [string]::Join("`n", $scriptLines) + "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($localScriptPath, $lfScript, $utf8NoBom)

          & $scpExe -i $keyPath -P $port -o StrictHostKeyChecking=accept-new $localScriptPath "$userName@$hostName`:$remoteScript"
          if ($LASTEXITCODE -ne 0) { throw "SCP script upload failed" }

          & $sshExe -i $keyPath -p $port -o StrictHostKeyChecking=accept-new "$userName@$hostName" "chmod +x $remoteScript && bash $remoteScript && rm -f $remoteScript"
          if ($LASTEXITCODE -ne 0) { throw "Remote deploy command failed" }
