name: Deploy Web to cPanel (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force web deploy even when no web-related changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: ["main"]

jobs:
  deploy-web:
    # Runner must be inside FortiClient VPN and allowed by hoster.by ACL.
    runs-on: [self-hosted, windows]
    timeout-minutes: 35
    concurrency:
      group: deploy-web-main
      cancel-in-progress: true

    steps:
      - name: Validate required secrets (fail-fast)
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_HOST)) { throw "Missing secret: CPANEL_HOST" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_USER)) { throw "Missing secret: CPANEL_USER" }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY) -and [string]::IsNullOrWhiteSpace($env:CPANEL_SSH_KEY_B64)) {
            throw "Missing secret: set CPANEL_SSH_KEY or CPANEL_SSH_KEY_B64"
          }
          if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { echo "CPANEL_PORT is empty, defaulting to 22" }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web-related changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'src/**'
              - 'public/**'
              - 'next.config.*'
              - 'package.json'
              - 'package-lock.json'

      - name: Skip web deploy (no relevant changes)
        if: steps.changes.outputs.web != 'true' && github.event.inputs.force_deploy != 'true'
        shell: powershell
        run: |
          Write-Host "No web-related changes detected. Skipping web build/deploy."

      - name: Setup Node.js
        if: steps.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: npm ci

      - name: Build Next.js (webpack)
        if: steps.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: npm run build -- --webpack

      - name: Prepare lightweight deploy package
        if: steps.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force .\deploy -ErrorAction SilentlyContinue
          New-Item -ItemType Directory .\deploy\.next -Force | Out-Null
          New-Item -ItemType Directory .\deploy\tmp -Force | Out-Null
          # CloudLinux Node.js Selector expects node_modules as a symlink in app root.
          # Exclude standalone/node_modules from deploy artifact.
          if (Test-Path .\deploy\node_modules) { Remove-Item -Recurse -Force .\deploy\node_modules }
          robocopy .\.next\standalone .\deploy /E /XD node_modules | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          Copy-Item .\.next\static .\deploy\.next\ -Recurse -Force
          Copy-Item .\public .\deploy\ -Recurse -Force
          Copy-Item .\package-lock.json .\deploy\package-lock.json -Force
          Get-Date -Format "yyyy-MM-ddTHH:mm:ssK" | Set-Content .\deploy\tmp\restart.txt
          if (Test-Path .\web-release.tar.gz) { Remove-Item .\web-release.tar.gz -Force }
          tar -czf .\web-release.tar.gz -C .\deploy .

      - name: Upload and deploy via SSH
        if: steps.changes.outputs.web == 'true' || github.event.inputs.force_deploy == 'true'
        shell: powershell
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_NODE_MAJOR: ${{ secrets.CPANEL_NODE_MAJOR }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_KEY_B64: ${{ secrets.CPANEL_SSH_KEY_B64 }}
        run: |
          $hostName = $env:CPANEL_HOST
          $userName = $env:CPANEL_USER
          $port = if ([string]::IsNullOrWhiteSpace($env:CPANEL_PORT)) { "22" } else { $env:CPANEL_PORT }
          $nodeMajor = if ([string]::IsNullOrWhiteSpace($env:CPANEL_NODE_MAJOR)) { "20" } else { $env:CPANEL_NODE_MAJOR }

          $remoteArchive = "/home/$userName/tmp/web-release.tar.gz"
          $remoteAppDir = "/home/$userName/apps/ogkjt-web"
          $remoteScript = "/home/$userName/tmp/deploy-web.sh"

          $localScriptPath = Join-Path $env:RUNNER_TEMP "deploy-web.sh"
          $template = Get-Content -Raw ".\scripts\ci\deploy-web.sh.tpl"
          $lfScript = $template.Replace("__REMOTE_APP_DIR__", $remoteAppDir).Replace("__REMOTE_ARCHIVE__", $remoteArchive).Replace("__USER__", $userName).Replace("__NODE_MAJOR__", $nodeMajor)
          $lfScript = $lfScript -replace "`r`n", "`n"
          $lfScript = $lfScript -replace "`r", "`n"
          if (-not $lfScript.EndsWith("`n")) { $lfScript += "`n" }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($localScriptPath, $lfScript, $utf8NoBom)

          .\scripts\ci\invoke-cpanel-deploy.ps1 `
            -HostName $hostName `
            -UserName $userName `
            -Port $port `
            -SshKey $env:CPANEL_SSH_KEY `
            -SshKeyB64 $env:CPANEL_SSH_KEY_B64 `
            -LocalArchivePath ".\web-release.tar.gz" `
            -RemoteArchivePath $remoteArchive `
            -LocalScriptPath $localScriptPath `
            -RemoteScriptPath $remoteScript `
            -PrecheckCommand "mkdir -p /home/$userName/tmp $remoteAppDir $remoteAppDir/tmp"
