name: Deploy Web to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required cPanel secrets (fail-fast)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -e
          [ -n "$CPANEL_HOST" ] || { echo "Missing secret: CPANEL_HOST"; exit 1; }
          [ -n "$CPANEL_USER" ] || { echo "Missing secret: CPANEL_USER"; exit 1; }
          [ -n "$CPANEL_SSH_KEY" ] || { echo "Missing secret: CPANEL_SSH_KEY"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (webpack)
        run: npm run build -- --webpack

      - name: Prepare deploy directory (standalone)
        run: |
          rm -rf deploy
          mkdir -p deploy/.next deploy/tmp
          cp -R .next/standalone/* deploy/
          cp -R .next/static deploy/.next/static
          cp -R public deploy/public
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      - name: Pack web release
        run: |
          tar -czf web-release.tar.gz -C deploy .

      - name: Upload release archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          source: "web-release.tar.gz"
          target: "/home/${{ secrets.CPANEL_USER }}/tmp"
          overwrite: true

      - name: Deploy release on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="/home/${{ secrets.CPANEL_USER }}/apps/ogkjt-new"
            ARCHIVE="/home/${{ secrets.CPANEL_USER }}/tmp/web-release.tar.gz"

            mkdir -p "$APP_DIR" "$APP_DIR/tmp"
            rm -rf "$APP_DIR/.next"
            tar -xzf "$ARCHIVE" -C "$APP_DIR"

            touch "$APP_DIR/tmp/restart.txt"
            rm -f "$ARCHIVE"
