name: Deploy Web to cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (webpack)
        run: npm run build -- --webpack

      - name: Prepare deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -R .next deploy/.next
          cp -R public deploy/public
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cp next.config.ts deploy/next.config.ts
          cp app.js deploy/app.js
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USER }}
          password: ${{ secrets.FTPS_PASSWORD }}
          port: ${{ secrets.FTPS_PORT || 21 }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: /apps/ogkjt-new/
          dangerous-clean-slate: false
